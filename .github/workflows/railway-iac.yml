name: Notes infrastructure

on:
  push:
    branches: [main, prod]
    paths: &config_paths
      - ".railway/railway.ts"
      - ".github/workflows/railway-iac.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [main, prod]
    paths: *config_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-iac-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  config:
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ (github.base_ref || github.ref_name) == 'prod' && secrets.NOTES_RAILWAY_TOKEN_PRODUCTION || secrets.NOTES_RAILWAY_TOKEN_DEV }}
      RAILWAY_PROJECT_ID: 7c451bd1-350a-4fb3-a08f-5295863269ce
      RAILWAY_ENVIRONMENT_ID: ${{ (github.base_ref || github.ref_name) == 'prod' && 'f65d1bcb-a786-4678-a431-e9f6c3ff154f' || '8cbb1415-ac2b-46c3-ae8c-144265017189' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check IaC types and token
        run: |
          test -n "$RAILWAY_TOKEN"
          pnpm exec tsc --noEmit --strict --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext .railway/railway.ts
      - name: Plan configuration
        run: pnpm exec railway config plan --file .railway/railway.ts --out "$RUNNER_TEMP/railway-plan.json"
      - name: Confirm this is the latest branch commit
        if: github.event_name != 'pull_request'
        run: |
          branch_sha=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$branch_sha" = "$GITHUB_SHA"
      - name: Apply pinned plan
        if: github.event_name != 'pull_request'
        run: pnpm exec railway config apply --plan "$RUNNER_TEMP/railway-plan.json" --yes
      - name: Verify applied configuration
        if: github.event_name != 'pull_request'
        run: pnpm exec railway config plan --file .railway/railway.ts --detailed-exit-code
