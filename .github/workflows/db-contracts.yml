name: DB Contracts

on:
  pull_request:
    paths:
      - ".github/workflows/db-contracts.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "lib/atomic-editor/**"
      - "lib/db-notes/**"
      - "apps/notes-android/**"
      - "apps/notes-next/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/db-contracts.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "lib/atomic-editor/**"
      - "lib/db-notes/**"
      - "apps/notes-android/**"
      - "apps/notes-next/**"
  workflow_dispatch:

jobs:
  verify-notes:
    name: Verify Notes contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: app_contracts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_contracts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NOTES_URL: postgres://postgres:postgres@localhost:5432/app_contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Show PostgreSQL versions
        run: |
          which psql
          which pg_dump
          pg_dump --version
          psql --version
          psql "$DB_NOTES_URL" -Atqc "SELECT version()"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify @lib/db-notes
        run: pnpm --filter @lib/db-notes db:verify

      # DB-backed regression tests (anonymous merge). Requires the schema that
      # db:verify just migrated into the service container. The tests only run
      # against an explicit DB_NOTES_TEST_URL so they can never write to a
      # real DB_NOTES_URL by accident.
      - name: Test @lib/db-notes
        run: pnpm --filter @lib/db-notes test
        env:
          DB_NOTES_TEST_URL: ${{ env.DB_NOTES_URL }}

  verify-notes-clients:
    name: Verify Notes clients
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Repo-local SDK provisioning (~400MB) is slow and flaky on cold download.
      # Cache it between runs; key rotates when SDK package list or compileSdk changes.
      - name: Cache Android SDK and Gradle
        uses: actions/cache@v4
        with:
          path: |
            .android-sdk
            .android-user-home
            .gradle
          key: android-sdk-${{ runner.os }}-api36-${{ hashFiles('apps/notes-android/tools/install-android-sdk.sh', 'apps/notes-android/app/build.gradle.kts') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-api36-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test notes-next adapter parity
        run: pnpm --filter notes-next test

      - name: Type-check notes-next
        run: pnpm --filter notes-next check-types

      - name: Test notes-android adapter parity
        run: pnpm --filter notes-android test

      # Turbo forwards args after `--` to each package script (e.g. `next build`), not to
      # Turbo's own --filter. Use `turbo run build --filter=...` so only those packages build.
      - name: Build notes clients (turbo-filtered)
        run: pnpm exec turbo run build --filter=notes-next --filter=notes-android
